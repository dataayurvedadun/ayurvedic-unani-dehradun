<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="256" cy="256" r="200" fill="#032e24" opacity="0.6" />

  <!-- Medical Cross / Ayush Center -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="226" y="116" width="60" height="280" rx="20" fill="#ffffff" />
    <!-- Horizontal bar -->
    <rect x="116" y="226" width="280" height="60" rx="20" fill="#ffffff" />
  </g>

  <!-- Ayurveda Herbal Leaves -->
  <!-- Right Leaf -->
  <path d="M 276 216 C 360 140, 420 180, 400 270 C 350 270, 290 260, 276 216 Z" fill="#34d399" opacity="0.95" />
  <path d="M 276 216 Q 340 220 395 265" stroke="#065f46" stroke-width="4" fill="none" />

  <!-- Left Leaf -->
  <path d="M 236 216 C 152 140, 92 180, 112 270 C 162 270, 222 260, 236 216 Z" fill="#10b981" opacity="0.95" />
  <path d="M 236 216 Q 172 220 117 265" stroke="#065f46" stroke-width="4" fill="none" />

  <!-- Center Gold Kalash / Lotus Core -->
  <circle cx="256" cy="256" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Top Star / Emblem Crown -->
  <polygon points="256,65 264,85 285,85 268,98 274,118 256,105 238,118 244,98 227,85 248,85" fill="url(#goldGrad)" />
</svg>
